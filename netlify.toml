[build]
  command = "npm run build"
  publish = "dist"

# Security headers for every page.
# connect-src: Supabase (database, login, file upload). frame-src: PDF ads shown from Supabase Storage.
# img-src allows any https picture; the database only accepts links to our own storage anyway.
# If you add a second service later (for example Razorpay in Phase 2), add its address here on purpose.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://plausible.io; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://*.supabase.co https://plausible.io; frame-src https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
